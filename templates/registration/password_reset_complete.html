{% extends 'base.html' %}
{% block title %}Password Changed{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card text-center">
    <div class="auth-logo" style="color:#00d97e"><i class="bi bi-check-circle-fill"></i></div>
    <h1 class="auth-title">Password Reset!</h1>
    <p class="auth-subtitle">Your password has been set. You can now log in with your new password.</p>
    <a href="{% url 'login' %}" class="btn-auth mt-3"><i class="bi bi-box-arrow-in-right me-2"></i>Go to Login</a>
  </div>
</div>
{% endblock %}
