{% extends 'base.html' %}
{% block title %}Password Reset Sent{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card text-center">
    <div class="auth-logo" style="color:#00d97e"><i class="bi bi-envelope-check-fill"></i></div>
    <h1 class="auth-title">Check your email</h1>
    <p class="auth-subtitle">A password reset link has been sent to your email address. Check your inbox (and spam folder).</p>
    <a href="{% url 'login' %}" class="btn-auth mt-3">← Back to Login</a>
  </div>
</div>
{% endblock %}
