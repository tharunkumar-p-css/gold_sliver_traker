{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-glow auth-glow-gold"></div>
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo"><i class="bi bi-shield-lock"></i></div>
      <h1 class="auth-title">Forgot Password?</h1>
      <p class="auth-subtitle">Enter your email and we'll send a reset link.</p>
    </div>
    <form method="post" class="auth-form">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-wrap">
          <i class="bi bi-envelope input-icon"></i>
          <input type="email" name="email" class="form-control dark-input" placeholder="you@example.com" required>
        </div>
      </div>
      <button type="submit" class="btn-auth"><i class="bi bi-send me-2"></i>Send Reset Link</button>
    </form>
    <p class="auth-footer"><a href="{% url 'login' %}" class="auth-link">← Back to Login</a></p>
  </div>
</div>
{% endblock %}
