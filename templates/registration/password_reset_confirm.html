{% extends 'base.html' %}
{% block title %}Set New Password{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-glow auth-glow-gold"></div>
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo"><i class="bi bi-key-fill"></i></div>
      <h1 class="auth-title">Set New Password</h1>
    </div>
    <form method="post" class="auth-form">
      {% csrf_token %}
      <div class="form-group mb-3">
        <label class="form-label">New Password</label>
        <div class="input-wrap">
          <i class="bi bi-lock input-icon"></i>
          <input type="password" name="new_password1" class="form-control dark-input" placeholder="••••••••" required>
        </div>
      </div>
      <div class="form-group mb-4">
        <label class="form-label">Confirm New Password</label>
        <div class="input-wrap">
          <i class="bi bi-lock-fill input-icon"></i>
          <input type="password" name="new_password2" class="form-control dark-input" placeholder="••••••••" required>
        </div>
      </div>
      <button type="submit" class="btn-auth"><i class="bi bi-check2-circle me-2"></i>Reset Password</button>
    </form>
  </div>
</div>
{% endblock %}
